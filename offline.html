<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Нет сети — FinFocus</title>
    <style>
        /* Самодостаточная страница: без внешних css/js/svg. SW отдаёт её
         * на URL любого раздела, относительные пути резолвились бы от
         * запрошенного адреса и дали бы 404. */
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: #0e1118; color: #e8ecf5; text-align: center; padding: 24px; box-sizing: border-box; }
        .card { max-width: 480px; }
        h1 { font-size: 1.6em; margin: 0 0 .5em; }
        p { line-height: 1.5; color: #b8c2d9; }
        .btn { display: inline-block; margin-top: 8px; padding: 10px 18px; border-radius: 10px;
               background: #1f6feb; color: #fff; text-decoration: none; font-weight: 600;
               border: none; font-size: 1em; cursor: pointer; font-family: inherit; }
        .cached { text-align: left; margin: 18px 0 0; padding: 14px; border: 1px solid rgba(127,127,127,.3);
                  border-radius: 12px; background: rgba(127,127,127,.08); }
        .cached h2 { font-size: 1em; margin: 0 0 8px; color: #e8ecf5; }
        .cached ul { margin: 0; padding: 0 0 0 4px; list-style: none; }
        .cached li { margin: 4px 0; }
        .cached a { color: #7ab3ff; text-decoration: none; }
        @media (prefers-color-scheme: light) {
            body { background: #eef2fa; color: #17202e; }
            p { color: #45506a; }
        }
    </style>
</head>
<body>
    <main class="card" id="main-content">
        <h1>📡 Нет сети</h1>
        <p>Страница не загрузилась: нет интернета. Уже открытые страницы сайта работают офлайн.</p>
        <p><a class="btn" id="homeLink" href="/">На главную</a></p>
        <p>Как только связь вернётся, обновите страницу.</p>
        <div class="cached" id="cachedBox" hidden>
            <h2>Доступно офлайн:</h2>
            <ul id="cachedList"></ul>
        </div>
        <p><button type="button" class="btn" id="retryBtn">🔄 Проверить связь</button></p>
    </main>
    <script>
        /* Абсолютная ссылка: база вычисляется из адреса страницы
         * («/FinFocus/» на проектном Pages, «/» на своём домене). */
        (function () {
            var base = location.pathname.indexOf('/FinFocus/') === 0 ? '/FinFocus/' : '/';
            var link = document.getElementById('homeLink');
            if (link) link.setAttribute('href', base + 'index.html');

            /* Какие разделы реально лежат в наших кэшах */
            if ('caches' in window) {
                caches.keys().then(function (keys) {
                    return Promise.all(keys.filter(function (k) { return k.indexOf('finfocus-') === 0; })
                        .map(function (k) { return caches.open(k); }));
                }).then(function (stores) {
                    var seen = {};
                    return Promise.all(stores.map(function (st) {
                        return st.keys().then(function (reqs) {
                            reqs.forEach(function (r) {
                                var u = new URL(r.url);
                                if (u.pathname.slice(-5) === '.html' && u.pathname.indexOf('offline') === -1) seen[u.pathname] = true;
                            });
                        });
                    })).then(function () {
                        var names = Object.keys(seen).sort();
                        var box = document.getElementById('cachedBox');
                        var list = document.getElementById('cachedList');
                        if (!box || !list) return;
                        if (!names.length) return;
                        box.hidden = false;
                        var titles = { index: '🏠 Главная', budget: '📊 Бюджет', savings: '🎯 Накопления', discounts: '🏷️ Скидки', finlit: '🎓 Финграмотность', habits: '🧠 Привычки', loans: '💳 Кредиты', vyhod: '🕳️ Выход из ямы', health: '🩺 Здоровье', streaming: '🎥 Стриминг', bicycle: '🚲 Велосипед', app: '🕹️ Тренажёр', search: '🔍 Поиск', articles: '📚 Финбаза' };
                        names.forEach(function (p) {
                            var li = document.createElement('li');
                            var a = document.createElement('a');
                            a.href = p;
                            var label = p.replace('.html', '').split('/').pop() || p;
                            var t = null;
                            Object.keys(titles).forEach(function (key) { if (!t && label.indexOf(key) !== -1) t = titles[key]; });
                            a.textContent = t || '📄 ' + label;
                            li.appendChild(a);
                            list.appendChild(li);
                        });
                    });
                }).catch(function () { /* нет кэшей: просто без списка */ });
            }

            /* «Проверить связь»: пингуем внешний 204-эндпоинт мимо нашего SW */
            var btn = document.getElementById('retryBtn');
            if (btn) btn.addEventListener('click', function () {
                btn.textContent = '⏳ Проверяем…';
                fetch('https://www.gstatic.com/generate_204', { mode: 'no-cors', cache: 'no-store' })
                    .then(function () { window.location.reload(); })
                    .catch(function () {
                        btn.textContent = '📡 Сети пока нет. Попробуйте ещё раз';
                    });
            });
        })();
    </script>
</body>
</html>
