name: rates

on:
  schedule:
    # Ежедневно в 06:00 UTC. Внимание: Actions запускает cron только
    # для workflow-файла на основной ветке (main).
    - cron: '0 6 * * *'
  workflow_dispatch:
  # Временный живой прогон для ветки ТЗ (убрать перед мержем)
  push:
    branches: ['tz-2026-11-27']
    paths: ['.github/workflows/rates.yml']

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch CBR daily rates (public feed, no keys)
        run: curl -fsSL https://www.cbr-xml-daily.ru/daily_json.js -o /tmp/daily.json

      - name: Build compact data/rates.json
        run: |
          mkdir -p data
          node .github/scripts/build-rates.js

      - name: Commit refreshed rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          if git diff --cached --quiet; then
            echo "Rates unchanged, nothing to commit"
          else
            git commit -m "data: refresh rates from CBR public feed"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
