name: rates

on:
  schedule:
    # Ежедневно в 06:00 UTC. Внимание: Actions запускает cron только
    # для workflow-файла на основной ветке (main).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CBR daily rates (public feed, no keys)
        run: curl -fsSL https://www.cbr-xml-daily.ru/daily_json.js -o /tmp/daily.json

      - name: Build compact data/rates.json
        run: |
          mkdir -p data
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("/tmp/daily.json", "utf8"));
            const pick = (v) => v ? { value: v.Value, prev: v.Previous } : null;
            const out = {
              source: "https://www.cbr-xml-daily.ru/ (public CBR feed, no keys)",
              date: d.Date,
              usd: pick(d.Valute.USD),
              eur: pick(d.Valute.EUR),
              cny: pick(d.Valute.CNY)
            };
            fs.writeFileSync("data/rates.json", JSON.stringify(out, null, 2) + "
");
          '

      - name: Commit refreshed rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          if git diff --cached --quiet; then
            echo "Rates unchanged, nothing to commit"
          else
            git commit -m "data: refresh rates from CBR public feed"
            git push
          fi
