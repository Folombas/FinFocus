name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JS syntax check (node --check)
        run: |
          status=0
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f" || status=1
          done
          exit $status

      - name: HTML structure check (single <body>, at most one <header>)
        run: |
          status=0
          for f in $(find . -name '*.html' | sort); do
            body=$(grep -o '<body' "$f" | wc -l)
            header=$(grep -o '<header' "$f" | wc -l)
            echo "$f: body=$body header=$header"
            if [ "$body" -ne 1 ]; then echo "ERROR: $f must have exactly one <body>"; status=1; fi
            if [ "$header" -gt 1 ]; then echo "ERROR: $f must have at most one <header>"; status=1; fi
          done
          exit $status
